name: flutter_highlight
description: Syntax highlighting widget for Flutter with lots of languages and themes support.
version: 0.7.0
homepage: https://github.com/git-touch/highlight

environment:
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  highlight:
    git:
      url: git@github.com:CodeDepot-Hub/highlight.dart.git
      ref: 1.0/1.0.0
      path: highlight

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
   highlight:
     path: ../highlight
